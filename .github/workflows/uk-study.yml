# The State of UK Websites study (study/run.mjs): checks a sample of .uk websites and commits the
# aggregates to src/study-data.js on the branch it ran on (Actions → UK website study → Run workflow).
# Per-site rows are kept as a run artifact for 90 days, not in the repo (no list of individual sites is published).
name: UK website study
on:
  workflow_dispatch:
    inputs:
      top: { description: "Most-linked .uk sites", default: "500" }
      sample: { description: "Everyday .uk sites", default: "1000" }
permissions:
  contents: write
concurrency: uk-study
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node study/run.mjs --top "${{ inputs.top || '500' }}" --sample "${{ inputs.sample || '1000' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: study-rows
          path: study/rows.json
          retention-days: 90
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/study-data.js
          git diff --cached --quiet || git commit -m "UK website study results ($(date -u +%F))"
          git push
