<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Website Crawler{% endblock %} | XKey</title>
<meta name="robots" content="noindex">
<style>
 :root{--bg:#f7f7f8;--card:#fff;--text:#1d1d1f;--muted:#6b6b70;--accent:#2563eb;--border:#e3e3e8;--bad:#b42318;--warn:#a15c00;--good:#127a3e}
 @media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--text:#ececf0;--muted:#9a9aa2;--accent:#5b8cff;--border:#2e2e33;--bad:#ff6b5e;--warn:#f0a43a;--good:#4cc27a}}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
 main{max-width:760px;margin:32px auto;padding:0 16px} .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
 h1{font-size:1.5rem;margin:0 0 4px} h2{font-size:1.15rem;margin:24px 0 8px} p.sub{color:var(--muted);margin:0 0 16px}
 label{display:block;font-weight:600;margin:14px 0 6px} input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
 button,.btn{display:inline-block;margin:12px 8px 0 0;padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none;min-height:44px}
 .btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)} .err{color:var(--bad);margin-top:12px}
 .bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin:12px 0 6px} .bar>div{height:100%;background:var(--accent);width:0;transition:width .4s}
 pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.8rem;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
 .muted{color:var(--muted);font-size:.9rem}
 label.check{display:flex;gap:8px;align-items:center;font-weight:400} label.check input{width:auto;min-width:20px;height:20px}
 details{margin-top:14px} summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--accent)}
 summary::before{content:"+";display:inline-block;width:1em;text-align:center;font-weight:700} details[open]>summary::before{content:"\2212"}
 table{width:100%;border-collapse:collapse;font-size:.92rem} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
 th{font-weight:600} td.num{text-align:right;white-space:nowrap} .win{color:var(--good);font-weight:700}
 .score{font-size:2.6rem;font-weight:800;line-height:1} .sev-High{color:var(--bad);font-weight:600} .sev-Medium{color:var(--warn);font-weight:600} .sev-Low{color:var(--muted)}
 .row{display:flex;gap:12px;flex-wrap:wrap} .row>div{flex:1 1 200px}
 code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:.85rem;overflow-wrap:anywhere}
 a{color:var(--accent)}
 @media (max-width:560px){ #issues tr{display:grid;grid-template-columns:70px 1fr;border-bottom:1px solid var(--border)} #issues td,#issues th{border:0;padding:6px 4px} #issues td:last-child{grid-column:1 / -1;padding-top:0;font-size:.85rem;color:var(--muted)} #issues tr:first-child{display:none} }
</style>
</head>
<body><main>
{% block body %}{% endblock %}
<p class="muted">A free tool from <a href="https://xkey.co.uk/">XKey</a>. Only crawl sites you own or have permission to crawl.</p>
</main></body></html>
