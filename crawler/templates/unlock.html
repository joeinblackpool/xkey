{% extends "base.html" %}
{% block title %}Get your spreadsheets{% endblock %}
{% block body %}
<div class="card">
 <h1>Where should we send updates?</h1>
 <p class="sub">Enter your email to download the spreadsheets for {{ host }}.</p>
 <form method="post">
  <label for="email">Your email</label>
  <input id="email" name="email" type="email" required placeholder="you@yourbusiness.co.uk">
  <label class="check"><input type="checkbox" name="marketing_ok" value="1"> Send me occasional SEO tips from XKey</label>
  <input type="hidden" name="next" value="{{ next_url }}">
  <button type="submit">Continue</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
 </form>
</div>
{% endblock %}
