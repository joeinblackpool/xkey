# Render Blueprint: in Render, choose New > Blueprint and pick the GitHub
# repo joeinblackpool/xkey. Render reads this file and runs the Python
# crawler in crawler/ as its own service. It does not touch the Worker.
services:
  - type: web
    name: seo-crawler
    runtime: python
    rootDir: crawler
    # "free" works for trying it out, but free services go to sleep after
    # about 15 minutes with no visitors, which stops long crawls. Change to
    # "starter" (paid) for crawls of thousands of pages.
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process with threads: crawl jobs are tracked in memory.
    startCommand: gunicorn -w 1 --threads 8 --timeout 120 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: JOB_RETENTION_HOURS
        value: "48"
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_URL
        value: https://crawler.xkey.co.uk
      # Optional extras. Fill these in on Render (Environment tab), never in code:
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM
      #   -> turns on "email me when the site changes"
      # REQUIRE_EMAIL=1 -> ask for an email before downloads
      # ADMIN_PASSWORD -> download leads at /admin/leads.csv (user "admin")
      # Scheduled re-crawls and leads are stored in DATA_DIR. On the free plan
      # that disk is wiped on every deploy; on a paid plan add a Render disk
      # mounted at /var/data and set DATA_DIR=/var/data.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
